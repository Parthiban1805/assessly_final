# FILE: docker-compose.yml (Complete and Final Version)

version: '3.8'

services:
  # NGINX REVERSE PROXY: The single public entry point for your entire application.
  nginx:
    image: nginx:latest
    container_name: assessly_nginx_proxy
    ports:
      - "80:80" # Maps public HTTP port 80 to this container's port 80.
    volumes:
      - ./client/build:/usr/share/nginx/html      # Mounts your built React app as the website content.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf # Mounts your custom Nginx configuration.
    depends_on:
      - node-backend
      - quiz-ai
      - proctor-ai
    networks:
      - assessly-net

  # NODE.JS BACKEND: Handles main application logic, users, assessments, etc.
  node-backend:
    build:
      context: ./server
      dockerfile: Dockerfile.node
    container_name: assessly_node_backend
    environment:
      - NODE_ENV=production
      # This tells Node.js to connect to the 'mongo' service inside the Docker network.
      - MONGO_URI=mongodb://mongo:27017/assesslydb
    depends_on:
      - mongo
    networks:
      - assessly-net

  # AI QUIZ SERVICE: Handles PDF processing and quiz generation.
  quiz-ai:
    build:
      context: ./server
      dockerfile: Dockerfile.quiz
    container_name: assessly_quiz_ai
    env_file:
      - ./server/.env # Loads GROQ/GOOGLE API keys from your .env file.
    networks:
      - assessly-net

  # AI PROCTORING SERVICE: Handles all real-time proctoring analysis.
  proctor-ai:
    build:
      context: ./proctor
      dockerfile: Dockerfile.proctor
    container_name: assessly_proctor_ai
    volumes:
      - proctor-enrolled-data:/app/enrolled_data
      - proctor-student-db:/app/student_db
    networks:
      - assessly-net

  # MONGODB DATABASE: Stores all persistent data for the application.
  mongo:
    image: mongo:latest
    container_name: assessly_mongodb
    volumes:
      - mongo-data:/data/db # Mounts the persistent volume to the data directory.
    networks:
      - assessly-net

# Define the shared private network for all services to communicate with each other.
networks:
  assessly-net:
    driver: bridge

# Define the persistent volumes to ensure data is not lost when containers are removed.
volumes:
  mongo-data:
  proctor-enrolled-data:
  proctor-student-db: